          useEffect(() => {
            const observer = new IntersectionObserver(
              (entries) => {
                if (entries[0].isIntersecting && !achievementUnlocked) {
                  setAchievementUnlocked(true);
                  setTimeout(() => setAchievementUnlocked(false), 4000);
                }
              },
              { threshold: 0.5 }
            );

            if (contactRef.current) {
              observer.observe(contactRef.current);
            }

            return () => {
              if (contactRef.current) observer.unobserve(contactRef.current);
            };
          }, [achievementUnlocked]);

          useEffect(() => {
            if (selectedProject) {
              document.body.style.overflow = 'hidden';
            } else {
              document.body.style.overflow = 'unset';
            }
            return () => { document.body.style.overflow = 'unset'; }
          }, [selectedProject]);

          const scrollToSection = (id) => {
            const element = document.getElementById(id);
            if (element) {
              element.scrollIntoView({ behavior: 'smooth' });
            }
          };

          const handleCopyEmail = () => {
            const textArea = document.createElement("textarea");
            textArea.value = PORTFOLIO_DATA.contact.email;
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              setIsCopied(true);
              setTimeout(() => setIsCopied(false), 2000);
            } catch (err) {
              console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
          };

          const renderVideo = (videoString) => {
            if (!videoString) return null;
            if (videoString.trim().startsWith('<iframe')) {
              const safeHtml = videoString.replace(/src="\/\//g, 'src="https://');
              return (
                <div 
                  className="w-full h-full relative [&>iframe]:absolute [&>iframe]:top-0 [&>iframe]:left-0 [&>iframe]:w-full [&>iframe]:h-full"
                  dangerouslySetInnerHTML={{ __html: safeHtml }}
                />
              );
            }
            return (
              <iframe 
                src={videoString} 
                className="w-full h-full absolute top-0 left-0" 
                frameBorder="0" 
                scrolling="no"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowFullScreen
                title="gameplay video"
              ></iframe>
            );
          };

          return (
            <div className="min-h-screen bg-[#0a0a0c] text-slate-300 font-sans selection:bg-[#00f0ff] selection:text-black relative overflow-x-hidden">

                  backgroundImage: `linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px)`,

                          <div>
                            <div className="font-mono text-[#00f0ff] text-sm mb-4 bg-[#00f0ff]/10 inline-block px-2 py-1 border border-[#00f0ff]/30 rounded">
                              Class: {PORTFOLIO_DATA.class}

                          </div>

                          <div className="p-5 md:p-6 flex-1 flex flex-col relative z-20 -mt-6">
                            <div className="bg-[#0f1115] border border-slate-700 p-4 rounded shadow-lg mb-4 cursor-pointer hover:border-[#00f0ff]/50 transition-colors" onClick={() => setSelectedProject(project)}>
                              <div className="flex justify-between items-baseline mb-1">
                                <h3 className="text-xl font-bold text-white tracking-tight group-hover:text-[#00f0ff] transition-colors">
                                  {project.title}
                                </h3>
                                <span className="text-[10px] text-slate-500">{project.id}</span>
                              </div>
                              <p className="text-xs text-amber-400 mb-2">{project.genre} | Role: {project.role}</p>
                              <p className="text-slate-400 text-sm leading-relaxed font-sans line-clamp-2">
                                {project.description}
                              </p>
                            </div>

                            <div className="mb-6 flex-1">
                              <div className="text-xs font-bold text-slate-500 mb-2 border-b border-slate-800 pb-1 flex items-center gap-2">
                                <Icon name="Link2" size={12} /> CORE_LOGIC_CONTRIBUTIONS
                              </div>
                              <ul className="space-y-2 text-sm text-slate-300 font-sans">
                                {project.contributions.map((item, i) => (
                                  <li key={i} className="flex items-start gap-2">
                                    <span className="text-[#00f0ff] mt-1 font-mono">{">"}</span>
                                    {item}
                                  </li>
                                ))}
                              </ul>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section id="contact" ref={contactRef} className="py-24 md:py-32 bg-[#0a0a0c] border-t border-slate-800 relative font-mono">
                  <div className="max-w-3xl mx-auto px-6 text-center relative z-10">
                    <div className="inline-block p-4 rounded-full bg-slate-900 border border-slate-700 mb-6 text-slate-500">
                      <Icon name="Terminal" size={32} />
                    </div>
                    <h2 className="text-2xl font-bold text-white mb-2">Init_Connection()</h2>
                    <p className="text-slate-400 mb-8 text-sm font-sans max-w-xl mx-auto">
                      正在寻找系统策划/关卡策划实习岗位。如果我的属性面板符合你们的项目需求，可点击下方编译请求连接。
                    </p>
                    
                    <button 
                      onClick={handleCopyEmail}
                      className="group relative inline-flex items-center justify-center gap-2 px-8 py-3 bg-transparent text-[#00f0ff] font-bold text-sm overflow-hidden border border-[#00f0ff] rounded cursor-pointer transition-all active:scale-95"
                    >
                      <span className="absolute inset-0 bg-[#00f0ff] w-0 group-hover:w-full transition-all duration-300 ease-out z-0"></span>
                      <Icon name={isCopied ? "Check" : "Mail"} size={16} className="relative z-10 group-hover:text-[#0a0a0c] transition-colors" />
                      <span className="relative z-10 group-hover:text-[#0a0a0c] transition-colors uppercase tracking-wider">
                        {isCopied ? "COPIED TO CLIPBOARD" : "EXECUTE COPY_EMAIL"}
                      </span>
                    </button>
                  </div>
                </section>
              </main>

              <footer className="py-2 px-4 border-t border-slate-800 bg-[#0f1115] text-slate-500 font-mono text-[10px] flex flex-col sm:flex-row justify-between items-center z-30 relative gap-2">
                <div className="flex gap-4">
                  <span>Output Log</span>
                  <span className="text-green-500">Compile Complete (0 errors, 0 warnings)</span>
                </div>
                <span>© {new Date().getFullYear()} {PORTFOLIO_DATA.name} | React Engine</span>
              </footer>

              <div className={`fixed bottom-12 right-6 bg-[#1a1f29] border-l-4 border-amber-500 shadow-2xl p-4 font-mono transform transition-all duration-500 z-30 flex items-start gap-3 w-72 ${achievementUnlocked ? 'translate-x-0 opacity-100' : 'translate-x-[150%] opacity-0'}`}>
                <Icon name="Trophy" size={20} className="text-amber-500 mt-1 flex-shrink-0" />
                <div>
                  <p className="text-amber-500 text-[10px] font-bold tracking-widest mb-1">系统_通知</p>
                  <p className="text-slate-200 text-xs">成就已解锁：<br/><span className="text-white font-bold">"探索到底"</span></p>
                  <p className="text-slate-500 text-[10px] mt-1 line-clamp-2">发现隐藏策划。欢迎各位联系...</p>
                </div>
              </div>

              {selectedProject && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-6 md:p-10 font-mono animate-in fade-in duration-200">
                  <div 
                    className="absolute inset-0 bg-[#050505]/90 backdrop-blur-md cursor-pointer"
                    onClick={() => setSelectedProject(null)}
                  ></div>

                  <div className="relative bg-[#0f1115] border border-slate-600 rounded-lg shadow-2xl w-full max-w-6xl h-full max-h-full md:max-h-[90vh] flex flex-col overflow-hidden z-10">
                    <div className="flex justify-between items-center bg-slate-800 px-4 py-2 border-b border-slate-600 flex-shrink-0">
                      <div className="flex items-center gap-3">
                        <span className="flex gap-1.5 items-center text-[#00f0ff]">
                          <Icon name="Terminal" size={16} />
                        </span>
                        <span className="text-xs text-slate-300 font-bold ml-2">Asset_Viewer.exe - [{selectedProject.id}]</span>
                      </div>
                      <button 
                        onClick={() => setSelectedProject(null)}
                        className="text-slate-400 hover:text-white transition-colors p-1"
                        title="Close"
                      >
                        <Icon name="X" size={18} />
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto overflow-x-hidden bg-[#0a0a0c] custom-scrollbar">
                      <div className="p-5 md:p-8 lg:p-10">
                        <div className="mb-8 border-b border-slate-800 pb-6">
                          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-4">
                            <div>
                              <h2 className="text-3xl md:text-5xl font-black text-white tracking-tight mb-2">
                                {selectedProject.title}
                              </h2>
                              <div className="flex flex-wrap items-center gap-3 text-sm">
                                <span className="text-amber-400 font-bold">{selectedProject.genre}</span>
                                <span className="text-slate-500">|</span>
                                <span className="text-slate-300">Role: {selectedProject.role}</span>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 bg-[#1a1f29] border border-slate-700 px-3 py-1.5 rounded text-[#00f0ff] text-xs">
                              <Icon name="Code" size={14} />
                              <span className="font-bold uppercase">Engine: {selectedProject.engine}</span>
                            </div>
                          </div>
                          <p className="text-slate-400 text-sm md:text-base font-sans max-w-4xl">
                            {selectedProject.description}
                          </p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 md:gap-12">
                          <div className="lg:col-span-7 flex flex-col gap-6">
                            {selectedProject.details?.video ? (
                              <div className="w-full aspect-video bg-black border border-slate-700 rounded overflow-hidden shadow-lg relative group">
                                {renderVideo(selectedProject.details.video)}
                              </div>
                            ) : (
                              <div className="w-full aspect-video bg-black border border-slate-700 rounded overflow-hidden shadow-lg relative">
                                <img 
                                  src={selectedProject.image} 
                                  alt={selectedProject.title} 
                                  className="w-full h-full object-cover"
                                />
                              </div>
                            )}

                            {selectedProject.details?.images && selectedProject.details.images.length > 0 && (
                              <div>
                                <div className="text-xs text-slate-500 mb-3 font-bold flex items-center gap-2">
                                  <Icon name="Box" size={14} /> MEDIA_GALLERY
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                  {selectedProject.details.images.map((imgUrl, idx) => (
                                    <a href={imgUrl} target="_blank" rel="noreferrer" key={idx} className="block overflow-hidden rounded border border-slate-800 hover:border-[#00f0ff] transition-colors aspect-video group">
                                       <img src={imgUrl} alt={`gallery-${idx}`} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                    </a>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>

                          <div className="lg:col-span-5 flex flex-col">
                            <div className="bg-[#151921] border border-slate-800 p-5 rounded mb-8 shadow-inner">
                              <div className="text-xs font-bold text-[#00f0ff] mb-4 flex items-center gap-2">
                                <Icon name="Link2" size={14} /> CORE_LOGIC_CONTRIBUTIONS
                              </div>
                              <ul className="space-y-3 text-sm text-slate-300 font-sans">
                                {selectedProject.contributions.map((item, i) => (
                                  <li key={i} className="flex items-start gap-3">
                                    <span className="text-[#00f0ff] mt-0.5 font-mono">{">"}</span>
                                    <span className="leading-relaxed">{item}</span>
                                  </li>
                                ))}
                              </ul>
                            </div>

                            {selectedProject.details?.longText && (
                              <div className="flex-1">
                                <div className="text-xs text-slate-500 mb-3 font-bold flex items-center gap-2">
                                  <Icon name="FileText" size={14} /> DESIGNER_NOTES.md
                                </div>
                                <div className="text-slate-400 text-sm font-sans leading-loose whitespace-pre-wrap text-justify bg-[#0a0a0c] border-l-2 border-slate-700 pl-4 py-2">
                                  {selectedProject.details.longText}
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PortfolioApp />);
    </script>
</body>
</html>
